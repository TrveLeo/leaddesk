<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadDesk — pipeline comercial</title>
    <!-- SVG inline: evita o 404 de /favicon.ico em todo carregamento sem
         adicionar um binário ao repo. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23226b47'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3ELD%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">LD</span>
        <span class="brand__name">LeadDesk</span>
      </div>

      <div class="topbar__controls">
        <label class="pill" for="lead-search">
          <span>Busca</span>
          <input id="lead-search" type="search" placeholder="Empresa ou contato" autocomplete="off" />
        </label>

        <label class="pill" for="week-select">
          <span>Semana</span>
          <select id="week-select"></select>
        </label>

        <button class="topbar__button" id="refresh-all" type="button">Atualizar</button>
      </div>
    </header>

    <main class="page">
      <p class="sr-only" id="dashboard-status" aria-live="polite">Carregando dados.</p>

      <!-- ================= KPI ================= -->
      <section class="kpi-row" aria-label="Indicadores">
        <button class="kpi" type="button" data-focus="all" aria-pressed="false">
          <span class="kpi__label">Leads ativos</span>
          <strong class="kpi__value" id="stat-leads">--</strong>
          <span class="kpi__delta" id="stat-leads-delta">--</span>
        </button>

        <button class="kpi" type="button" data-focus="urgent" aria-pressed="false">
          <span class="kpi__label">Ações na janela</span>
          <strong class="kpi__value" id="stat-followups">--</strong>
          <span class="kpi__delta" id="stat-followups-delta">--</span>
        </button>

        <button class="kpi" type="button" data-focus="rich" aria-pressed="false">
          <span class="kpi__label">Interações registradas</span>
          <strong class="kpi__value" id="stat-interactions">--</strong>
          <span class="kpi__delta" id="stat-interactions-delta">--</span>
        </button>

        <button class="kpi" type="button" data-focus="converted" aria-pressed="false">
          <span class="kpi__label">Prospects convertidos</span>
          <strong class="kpi__value" id="stat-converted">--</strong>
          <span class="kpi__delta" id="stat-converted-delta">--</span>
        </button>

        <button class="kpi" type="button" data-focus="no_date" aria-pressed="false">
          <span class="kpi__label">Taxa de conversão</span>
          <strong class="kpi__value" id="stat-rate">--</strong>
          <span class="kpi__delta" id="stat-rate-delta">--</span>
        </button>
      </section>

      <!-- ================= GRÁFICOS ================= -->
      <section class="grid grid--3">
        <article class="panel">
          <h2 class="panel__tab">Leads por etapa</h2>
          <div class="panel__body">
            <p class="panel__meta" id="stage-chart-meta">--</p>
            <div id="stage-chart"></div>
            <button class="table-toggle" type="button" data-table="stage-table" aria-expanded="false">
              Ver como tabela
            </button>
            <div id="stage-table" hidden></div>
          </div>
        </article>

        <article class="panel">
          <h2 class="panel__tab">Prospecção na semana</h2>
          <div class="panel__body">
            <p class="panel__meta" id="week-chart-meta">--</p>
            <div id="week-chart"></div>
            <button class="table-toggle" type="button" data-table="week-table" aria-expanded="false">
              Ver como tabela
            </button>
            <div id="week-table" hidden></div>
          </div>
        </article>

        <article class="panel">
          <h2 class="panel__tab">Seis semanas de operação</h2>
          <div class="panel__body">
            <p class="panel__meta" id="history-chart-meta">--</p>
            <div id="history-chart"></div>
            <button class="table-toggle" type="button" data-table="history-table" aria-expanded="false">
              Ver como tabela
            </button>
            <div id="history-table" hidden></div>
          </div>
        </article>
      </section>

      <!-- ================= PIPELINE + DETALHE ================= -->
      <section class="grid grid--sidebar">
        <article class="panel">
          <h2 class="panel__tab">Pipeline comercial</h2>
          <div class="panel__body">
            <div class="toolbar">
              <label class="field" for="focus-filter">
                <span>Foco</span>
                <select id="focus-filter">
                  <option value="all">Todas as oportunidades</option>
                  <option value="urgent">Ações atrasadas ou até amanhã</option>
                  <option value="rich">Leads com histórico mais profundo</option>
                  <option value="converted">Leads convertidos da prospecção</option>
                  <option value="no_date">Sem próxima ação definida</option>
                </select>
              </label>
              <p class="panel__meta" id="pipeline-total" style="margin: 0">--</p>
            </div>

            <div class="board" id="pipeline-board" aria-live="polite"></div>
          </div>
        </article>

        <article class="panel">
          <h2 class="panel__tab">Detalhe do lead</h2>
          <div class="panel__body" id="lead-detail">
            <p class="empty">Clique em um card do pipeline para ver contexto, próxima ação e histórico.</p>
          </div>
        </article>
      </section>

      <!-- ================= CONVERSÃO + ATIVIDADE ================= -->
      <section class="grid grid--sidebar">
        <article class="panel">
          <h2 class="panel__tab">Converter prospect em lead</h2>
          <div class="panel__body">
            <p class="panel__meta" id="conversion-count">--</p>

            <div class="grid grid--split">
              <div class="prospect-list" id="prospect-list"></div>

              <form class="form" id="conversion-form">
                <label>
                  <span>Prospect selecionado</span>
                  <input id="convert-company" type="text" disabled />
                </label>
                <label>
                  <span>Nome do contato</span>
                  <input id="convert-contact-name" name="contact_name" type="text" required />
                </label>
                <label>
                  <span>Telefone</span>
                  <input id="convert-phone" name="phone" type="text" />
                </label>
                <label>
                  <span>E-mail</span>
                  <input id="convert-email" name="email" type="email" />
                </label>
                <label>
                  <span>Notas</span>
                  <textarea id="convert-notes" name="notes" rows="3"></textarea>
                </label>
                <div class="form__actions">
                  <button class="button button--primary" id="convert-submit" type="submit" disabled>
                    Converter
                  </button>
                  <button class="button" id="convert-clear" type="button">Limpar</button>
                </div>
                <p class="form__feedback" id="conversion-feedback"></p>
              </form>
            </div>
          </div>
        </article>

        <article class="panel">
          <h2 class="panel__tab">Atividade recente</h2>
          <div class="panel__body">
            <div class="feed" id="activity-feed"></div>
          </div>
        </article>
      </section>
    </main>

    <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
